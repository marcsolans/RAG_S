name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Compile check
        run: python -m py_compile app.py ingest.py init_db.py

      - name: Tests (pytest)
        env:
          # Sense claus reals: els tests no en necessiten i l'auto-reindex
          # surt aviat. Es defineixen buides per evitar warnings.
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: pytest
